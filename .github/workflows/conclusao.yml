name: Conclusão (embeddings, conformidade, score)
on:
  workflow_run:                        # roda sozinha ao fim de cada coleta (mesmo parcial)
    workflows: ["Coleta agendada"]
    types: [completed]
  workflow_dispatch:                   # ou manualmente, p.ex. depois de mudar criteria.yaml/scoring.yaml
    inputs:
      run:
        description: "rodada de coleta (vazio = a mais recente)"
        required: false
      entes:
        description: "ids separados por vírgula (vazio = todos)"
        required: false
      embedder:
        description: "modelo (SERAFIM 768) ou hash (teste)"
        type: choice
        options: [modelo, hash]
        default: modelo
      forcar:
        description: "substituir avaliações que já têm revisão humana"
        type: boolean
        default: false

concurrency:
  group: conclusao
  cancel-in-progress: false

jobs:
  conclusao:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMBEDDINGS_MODELO: ${{ vars.EMBEDDINGS_MODELO || 'PORTULAN/serafim-100m-portuguese-pt-sentence-encoder-ir' }}
      EMBEDDINGS_DIM: ${{ vars.EMBEDDINGS_DIM || '768' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências (PyTorch só CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ml.txt
      - name: Cache do modelo de embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ vars.EMBEDDINGS_MODELO || 'serafim-100m-ir' }}
      - name: Embeddings + conformidade + score
        run: |
          ARGS="--embedder ${{ inputs.embedder || 'modelo' }}"
          [ -n "${{ inputs.run }}" ] && ARGS="$ARGS --run ${{ inputs.run }}"
          [ -n "${{ inputs.entes }}" ] && ARGS="$ARGS --entes ${{ inputs.entes }}"
          [ "${{ inputs.forcar }}" = "true" ] && ARGS="$ARGS --forcar"
          python -m compliance.pipeline $ARGS
      - name: Relatório no resumo do job
        if: always()
        run: |
          REL=$(ls -t data/runs/*-conformidade.md 2>/dev/null | head -1 || true)
          [ -n "$REL" ] && cat "$REL" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-conformidade
          path: data/runs/*-conformidade.md
          if-no-files-found: ignore
