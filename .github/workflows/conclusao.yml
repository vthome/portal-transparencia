name: Conclusão (embeddings, conformidade, score)
# Camada 2. Roda sozinha depois de cada "Coleta agendada" bem-sucedida (inclusive rodada parcial,
# em que só parte dos entes falhou); se a coleta falhar inteira, não reavalia a rodada anterior.
on:
  workflow_run:
    workflows: ["Coleta agendada"]
    types: [completed]
  workflow_dispatch:                   # ou manualmente, p.ex. depois de mudar criteria.yaml/scoring.yaml
    inputs:
      run:
        description: "rodada de coleta (vazio = a mais recente)"
        required: false
      entes:
        description: "ids separados por vírgula (vazio = todos)"
        required: false
      embedder:
        description: "modelo (SERAFIM 768) ou hash (teste)"
        type: choice
        options: [modelo, hash]
        default: modelo
      forcar:
        description: "substituir avaliações que já têm revisão humana"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: conclusao
  cancel-in-progress: false

jobs:
  conclusao:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMBEDDINGS_MODELO: ${{ vars.EMBEDDINGS_MODELO || 'PORTULAN/serafim-100m-portuguese-pt-sentence-encoder-ir' }}
      EMBEDDINGS_DIM: ${{ vars.EMBEDDINGS_DIM || '768' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências (PyTorch só CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ml.txt
      - name: Cache do modelo de embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ vars.EMBEDDINGS_MODELO || 'serafim-100m-ir' }}
      - name: Embeddings + conformidade + score
        env:
          EMBEDDER: ${{ inputs.embedder || 'modelo' }}    # entradas via env: nunca interpoladas no script
          RODADA: ${{ inputs.run }}
          ENTES: ${{ inputs.entes }}
          FORCAR: ${{ inputs.forcar }}
        run: |
          ARGS=(--embedder "$EMBEDDER")
          if [ -n "$RODADA" ]; then ARGS+=(--run "$RODADA"); fi
          if [ -n "$ENTES" ]; then ARGS+=(--entes "$ENTES"); fi
          if [ "$FORCAR" = "true" ]; then ARGS+=(--forcar); fi
          python -m compliance.pipeline "${ARGS[@]}"
      - name: Relatório no resumo do job
        if: always()
        run: |
          for REL in data/runs/*-conformidade.md; do        # uma rodada por job: no máximo um arquivo
            if [ -f "$REL" ]; then cat "$REL" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-conformidade
          path: data/runs/*-conformidade.md
          if-no-files-found: ignore
