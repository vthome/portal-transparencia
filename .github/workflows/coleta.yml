name: Coleta agendada
# Camada 1. Ao terminar com sucesso, dispara o workflow "Conclusão" (Camada 2).
on:
  schedule:
    # todos os dias às 11:00 em Brasília (14:00 UTC; o Brasil não tem horário de verão).
    # O cron do GitHub é em UTC e pode começar alguns minutos (até ~1 h em pico) depois.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      entes:
        description: "ids separados por vírgula (vazio = todos)"
        required: false
      max_paginas:
        description: "orçamento de páginas por ente"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:                          # nunca duas rodadas ao mesmo tempo
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chromium para portais SPA
        run: python -m playwright install --with-deps chromium
      - name: Verificação prévia (banco, schema, storage, Chromium, portais)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CRAWLER_USER_AGENT: ${{ vars.CRAWLER_USER_AGENT }}
        run: python -m ingestion.preflight
      - name: Rodada de coleta + extração
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CRAWLER_USER_AGENT: ${{ vars.CRAWLER_USER_AGENT }}
          GATILHO: ${{ github.event_name == 'schedule' && 'agendado' || 'manual' }}
          ENTES: ${{ inputs.entes }}               # entradas via env: nunca interpoladas no script
          MAX_PAGINAS: ${{ inputs.max_paginas }}
        run: |
          ARGS=(--gatilho "$GATILHO")
          if [ -n "$ENTES" ]; then ARGS+=(--entes "$ENTES"); fi
          if [ -n "$MAX_PAGINAS" ]; then ARGS+=(--max-paginas "$MAX_PAGINAS"); fi
          python -m ingestion.pipeline "${ARGS[@]}"
      - name: Relatório no resumo do job
        if: always()
        run: |
          for REL in data/runs/*-relatorio.md; do        # uma rodada por job: no máximo um arquivo
            if [ -f "$REL" ]; then cat "$REL" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Resumo e relatório da rodada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumo-coleta
          path: |
            data/runs/*.json
            data/runs/*-relatorio.md
          if-no-files-found: ignore
