name: Coleta agendada
on:
  schedule:
    - cron: "0 9 1,15 * *"           # dias 1 e 15, 06:00 em Brasília (09:00 UTC)
  workflow_dispatch:
    inputs:
      entes:
        description: "ids separados por vírgula (vazio = todos)"
        required: false
      max_paginas:
        description: "orçamento de páginas por ente"
        required: false
        default: "60"

concurrency:                          # nunca duas rodadas ao mesmo tempo
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chromium para portais SPA
        run: python -m playwright install --with-deps chromium
      - name: Rodada de coleta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CRAWLER_USER_AGENT: ${{ vars.CRAWLER_USER_AGENT }}
        run: |
          ARGS="--gatilho ${{ github.event_name == 'schedule' && 'agendado' || 'manual' }}"
          [ -n "${{ inputs.entes }}" ] && ARGS="$ARGS --entes ${{ inputs.entes }}"
          [ -n "${{ inputs.max_paginas }}" ] && ARGS="$ARGS --max-paginas ${{ inputs.max_paginas }}"
          python -m ingestion.pipeline $ARGS
      - name: Resumo da rodada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumo-coleta
          path: data/runs/*.json
          if-no-files-found: ignore
