name: CI
# Testes a cada push e pull request (e manual em Actions → CI → Run workflow).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:                       # um push novo cancela o CI anterior do mesmo branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Sintaxe, formatos e lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pyyaml
      - name: Sintaxe .py, YAML/TOML/JSON e ruff
        run: python scripts/verificar.py --sem-testes --sem-manifesto

  testes:
    name: Testes (unitários + Postgres/pgvector + dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:                    # banco efêmero com pgvector, como no Supabase (nunca o Supabase real)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            dashboard/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q -rfE --junitxml=junit.xml
      - name: Resumo no job
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib
          p = pathlib.Path("junit.xml")
          if not p.exists():
              print("Testes não chegaram a rodar."); raise SystemExit
          s = ET.parse(p).getroot()
          s = s if s.tag == "testsuite" else s[0]
          t, f, e, k = (int(s.get(x, 0)) for x in ("tests", "failures", "errors", "skipped"))
          print(f"### Testes: {t - f - e - k} ok · {f} falhas · {e} erros · {k} pulados")
          for c in s.iter("testcase"):
              for falha in list(c.findall("failure")) + list(c.findall("error")):
                  print(f"- ❌ `{c.get('classname')}::{c.get('name')}` — {(falha.get('message') or '')[:200]}")
          PY
