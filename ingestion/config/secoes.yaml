    termos: [emendas parlamentares, emendas, emenda pix, transferencias especiais]
  sic:
    quesitos: ["14.1", "14.2", "14.3", "14.4", "15.1", "15.2", "15.3", "15.4", "15.5", "15.6", "15.7"]
    termos: [e-sic, esic, sic, acesso a informacao, lei de acesso, lai, pedido de informacao,
             relatorio estatistico, informacoes classificadas, rol de informacoes]
  ouvidoria:
    quesitos: ["17.1", "17.2", "17.3"]
