# Entes monitorados. Um ente = uma entidade pública avaliada (aqui, as 7 prefeituras).
# - id: slug estável (chave primária no banco). Nunca reutilize um id para outro ente.
# - urls: o que já se sabe. A descoberta completa o que faltar a partir da capa do site
#   e registra divergências (ex.: link da capa aponta para outro portal).
# - robots_override: decisão de POLÍTICA, não técnica. Por padrão o robô respeita o
#   robots.txt; um override só deve ser ativado com justificativa (a LAI obriga a
#   publicação ativa) e fica gravado em cada snapshot coletado sob override.
# - verificar_tls: false apenas se o portal usar cadeia ICP-Brasil não reconhecida;
#   fica registrado no job.
# Levantamento inicial: 09/10/2026 (Plano de Execução).

padroes:
  uf: RJ
  tipo_entidade: prefeitura
  poder: executivo
  esfera: municipal

entes:
  - id: rj-rio-de-janeiro
    nome: Prefeitura da Cidade do Rio de Janeiro
    municipio: Rio de Janeiro
    codigo_ibge: "3304557"
    urls:
      site_oficial: https://prefeitura.rio/
      portal_transparencia: https://transparencia.prefeitura.rio/
      ouvidoria: https://ouvidoria.prefeitura.rio/
      dados_abertos: https://www.data.rio/
    dominios_extra: [rio.rj.gov.br, data.rio]   # informação espalhada em subdomínios

  - id: rj-niteroi
    nome: Prefeitura Municipal de Niterói
    municipio: Niterói
    codigo_ibge: "3303302"
    urls:
      site_oficial: https://www.niteroi.rj.gov.br/
      portal_transparencia: https://transparencia.niteroi.rj.gov.br/#/
      esic: https://esic.niteroi.rj.gov.br/

  - id: rj-marica
    nome: Prefeitura Municipal de Maricá
    municipio: Maricá
    codigo_ibge: "3302700"
    urls:
      site_oficial: https://www.marica.rj.gov.br/
      portal_transparencia: https://transparencia.marica.rj.gov.br/
      esic: https://esic.marica.rj.gov.br/index/

  - id: rj-duque-de-caxias
    nome: Prefeitura Municipal de Duque de Caxias
    municipio: Duque de Caxias
    codigo_ibge: "3301702"
    urls:
      site_oficial: https://portal.duquedecaxias.rj.gov.br/
      portal_transparencia: https://transparencia.duquedecaxias.rj.gov.br/

  - id: rj-itaborai
    nome: Prefeitura Municipal de Itaboraí
    municipio: Itaboraí
    codigo_ibge: "3301900"
    urls:
      site_oficial: https://site.ib.itaborai.rj.gov.br/
#      portal_transparencia: https://transparencia.ib.itaborai.rj.gov.br/
      portal_transparencia: https://transparencianovo.ib.itaborai.rj.gov.br/
      ouvidoria: https://itaborai.supernova.com.br:8446/md-sic-ouvidoria-mob/pages/protected/home/home.xhtml
    robots_override:
      ativo: false
      justificativa: "robots.txt bloqueia o portal; decidir se a LAI justifica override"

  - id: rj-japeri
    nome: Prefeitura Municipal de Japeri
    municipio: Japeri
    codigo_ibge: "3302270"
    urls:
      site_oficial: https://www.japeri.rj.gov.br/
      portal_transparencia: https://japeri.geosiap.net.br/portal-transparencia/home
      ouvidoria: https://falabr.cgu.gov.br/v2/?uf=rj&municipio=japeri
      esic: https://falabr.cgu.gov.br/web/rj/japeri/
    robots_override:
      ativo: false
      justificativa: "robots.txt do GeoSiap bloqueia robôs; decidir override"

  - id: rj-cachoeiras-de-macacu
    nome: Prefeitura Municipal de Cachoeiras de Macacu
    municipio: Cachoeiras de Macacu
    codigo_ibge: "3300803"
    urls:       # portal_transparencia: Betha Cloud — URL do ente a confirmar; a descoberta procura na capa
      site_oficial: https://www.prefeituracachoeiras.com/   # domínio .com (Wix) — confirmar se é o oficial
      portal_transparencia: https://transparencia.betha.cloud/#/VZIcwd3tEQSz63QIK2HkQw==*
    robots_override:
      ativo: false
      justificativa: "robots.txt do domínio .rj.gov.br bloqueia; decidir override"
